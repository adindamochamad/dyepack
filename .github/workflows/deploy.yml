name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test + build
        run: pnpm test && pnpm build && pnpm typecheck

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_hUaJuAaT3m5zliitihkAa8oH
          VERCEL_PROJECT_ID: prj_XLDRmaJFBCILbJGW0fXg6vkffeN5
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set in GitHub secrets — skipping deploy."
            echo "See docs/DEPLOY.md to enable auto-deploy."
            exit 0
          fi
          npx vercel deploy --prod --token "$VERCEL_TOKEN"
